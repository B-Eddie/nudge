name: Bug report
description: Something in Nudge isn't working
labels: [bug]
body:
  - type: input
    id: macos
    attributes: {label: macOS version and chip (e.g. 15.1, Apple silicon)}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Nudge version}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
