name: Release
# Pushing a tag like v0.6.0 builds a universal (Apple silicon + Intel) unsigned DMG and
# attaches it, with checksums, to a GitHub Release whose notes are that version's
# CHANGELOG.md section. Bump package.json, tauri.conf.json and Cargo.toml first.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run check:release -- ${{ github.ref_name }}
      - run: npm test
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
        env:
          CI: true
      - name: Checksums
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs ${{ github.ref_name }} > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Nudge ${{ github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
