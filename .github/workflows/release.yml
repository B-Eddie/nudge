name: Release

# Build platform bundles and publish them to a GitHub Release.
# Trigger: push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`
#
# REQUIRED GITHUB SECRETS (repo Settings > Secrets and variables > Actions):
#
#   TAURI_SIGNING_PRIVATE_KEY
#     The updater private key. The matching public key is already in
#     src-tauri/tauri.conf.json. The key file + password were generated
#     during the 1.0.0 polish pass — keep them somewhere safe and put the
#     key CONTENTS (not the file path) in this secret.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Password protecting the updater private key.
#
# OPTIONAL (Apple code signing + notarization — recommended for distribution):
#
#   APPLE_CERTIFICATE
#     Base64-encoded .p12 of your "Developer ID Application" certificate.
#     Export from Keychain Access, then: base64 -i cert.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD
#     Password for the .p12 above.
#   APPLE_SIGNING_IDENTITY
#     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#     App Store Connect credentials for notarization. APPLE_PASSWORD is an
#     app-specific password (appleid.apple.com > Sign-In and Security).
#
# Without the APPLE_* secrets the macOS .dmg still builds, but Gatekeeper
# will warn users on first launch ("unidentified developer").
#
# Linux notes: the ubuntu job builds .deb and .AppImage. The Linux port
# targets X11; on Wayland, focused-app/idle detection degrades gracefully.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            releaseBody: "See the assets below to download Nudge for macOS."
          - platform: ubuntu-22.04
            releaseBody: "See the assets below to download Nudge for Linux (.deb / .AppImage, X11)."

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (required for auto-updates to work)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing (optional but recommended — see header docs)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nudge ${{ github.ref_name }}"
          releaseBody: ${{ matrix.releaseBody }}
          releaseDraft: false
          prerelease: false
