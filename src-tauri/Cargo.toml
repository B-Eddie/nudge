[package]
name = "nudge"
version = "1.0.0"
description = "Nudge — a friendly desktop companion that helps you take breaks"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
cocoa = "0.25"
objc = "0.2"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSScreen", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSString", "NSBundle", "NSEnumerator"] }

[target.'cfg(target_os = "linux")'.dependencies]
active-win-pos-rs = "0.11.0"
device_query = "4.0.1"
x11rb = { version = "0.14.0", features = ["screensaver"] }
zbus = "5.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
active-win-pos-rs = "0.11.0"
device_query = "4.0.1"
