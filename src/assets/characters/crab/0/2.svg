<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges"><title>Pixel crab waving hello</title><defs><style>
.wa-body{transform-origin:7.5px 13px;animation:wa-bob 1.3s infinite ease-in-out}.wa-eye{transform-origin:7.5px 9px;animation:wa-blink 3.2s infinite}
@keyframes wa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}}@keyframes wa-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
</style></defs><g transform="translate(5.75 7.5) scale(3.5)"><ellipse cx="7.5" cy="15.5" rx="4.5" ry=".5" fill="#000" opacity=".5"/><g class="wa-body"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect x="0" y="9" width="2" height="2" fill="#DE886D"/><rect x="13" y="9" width="2" height="2" fill="#DE886D"/><rect x="14" y="3" width="2" height="4" fill="#DE886D"/><rect x="14" y="1.6" width=".8" height=".8" fill="#DE886D"/><rect x="15.2" y="1.6" width=".8" height=".8" fill="#DE886D"/><g class="wa-eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g><rect x="6.4" y="10.8" width="2.2" height="1" rx=".5" fill="#7a2230"/></g></g></svg>
