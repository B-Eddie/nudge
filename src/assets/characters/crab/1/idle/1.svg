<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges"><title>Pixel crab idle</title><defs><style>
.id-body{transform-origin:7.5px 13px;animation:id-bob 2.6s infinite ease-in-out}.id-shad{transform-origin:7.5px 15.5px;animation:id-shadow 2.6s infinite ease-in-out}.id-eye{transform-origin:7.5px 9px;animation:id-blink 3.2s infinite}
@keyframes id-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.4px)}}@keyframes id-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.97);opacity:.46}}@keyframes id-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
</style></defs><g transform="translate(5.75 7.5) scale(3.5)"><rect class="id-shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/><g class="id-body"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect x="0" y="9" width="2" height="2" fill="#DE886D"/><rect x="13" y="9" width="2" height="2" fill="#DE886D"/><g class="id-eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g><rect x="6.4" y="10.8" width="2.2" height="1" rx=".5" fill="#7a2230"/></g></g></svg>
