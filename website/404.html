<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Nudge</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/assets/logo-96.png" />
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222326; background: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      a:focus-visible { outline: 3px solid #466d9f; outline-offset: 5px; border-radius: 4px; }
      header { width: min(1120px, calc(100% - 48px)); margin-inline: auto; padding-block: 26px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #222326; font-size: 24px; font-weight: 650; letter-spacing: -.05em; text-decoration: none; }
      .brand img { width: 36px; height: 36px; border-radius: 10px; }
      main { display: grid; place-items: center; min-height: calc(100svh - 90px); padding: 48px 24px 120px; }
      .message { width: min(680px, 100%); text-align: center; }
      .number { display: inline-block; margin: 0 0 28px; padding: 10px 20px; color: #435d7d; background: #ebf0f8; border-radius: 999px; font-size: 15px; font-weight: 500; }
      h1 { margin: 0 0 24px; font-size: clamp(42px, 8vw, 64px); line-height: 1.06; font-weight: 600; letter-spacing: -.055em; }
      .description { max-width: 390px; margin: 0 auto 34px; color: #64686d; font-size: 18px; line-height: 1.6; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 26px; border-radius: 999px; background: #1f2025; color: #fff; font-size: 15px; font-weight: 500; text-decoration: none; }
      .button:hover { background: #35373e; }
      .secondary { display: block; width: fit-content; margin: 24px auto 0; color: #64686d; font-size: 14px; text-underline-offset: .22em; }
    </style>
  </head>
  <body>
    <header><a class="brand" href="/"><img src="/assets/logo-96.webp" width="36" height="36" alt="" />nudge</a></header>
    <main>
      <div class="message">
        <p class="number">404</p>
        <h1>A little lost.<br />Let’s head home.</h1>
        <p class="description">This page isn’t here. Your new desktop companion is just one click away.</p>
        <a class="button" href="/">Back to Nudge <span aria-hidden="true">&nbsp;↗</span></a>
        <a class="secondary" href="/#features">Explore the features</a>
      </div>
    </main>
  </body>
</html>
